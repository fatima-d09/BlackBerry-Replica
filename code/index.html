<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quill K1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="ttl"><h1>Quill K1</h1><p>A keyboard phone you can actually use. Text, call, plan and play.</p></header>
  <div class="phone" id="phone">
    <div class="top"><span class="brand">QUILL</span><span class="slot"></span><span class="led" id="led" title="Notification light"></span></div>
    <div class="bezel"><div id="scr"></div></div>
    <div class="nav">
      <button class="nk call" data-k="call" aria-label="Call (green key)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 3h3l1.4 4.2-2.1 1.3a11 11 0 0 0 5.6 5.6l1.3-2.1L20 13.4v3a2 2 0 0 1-2 2A15.6 15.6 0 0 1 4.6 5a2 2 0 0 1 2-2z"/></svg></button>
      <button class="nk" data-k="menu" aria-label="Menu"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      <button class="pad" id="pad" aria-label="Trackpad: swipe to move, click to select"></button>
      <button class="nk" data-k="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="nk end" data-k="end" aria-label="End / Home (red key)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13.5c5-4.6 13-4.6 18 0l-2.3 2.7-3.4-1.2v-2.6a10 10 0 0 0-6.6 0V15l-3.4 1.2z"/></svg></button>
    </div>
    <div class="kb" id="kb"></div>
  </div>
  <div class="legend">
    <span><i class="lk g"></i>Phone · answer</span>
    <span><i class="lk">≡</i>Menu</span>
    <span><i class="lk pd"></i>Trackpad: swipe, click</span>
    <span><i class="lk">↶</i>Back</span>
    <span><i class="lk r"></i>Hang up · home</span>
  </div>
  <p class="cap">On a computer, use the arrow keys and Enter as the trackpad, Esc for back and Tab for menu.</p>

</div>
<script src="script.js"></script>
</body>
</html>
